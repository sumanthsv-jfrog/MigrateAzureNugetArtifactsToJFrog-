trigger: none

jobs:
- job: MigrateSpecificNuGetPackages
  displayName: 'Migrate specific NuGet packages from ADO to JFrog'
  pool:
    name: Default

  variables:
    JFROG_NUGET_REPO: 'bupa-nuget-local'
    ADO_ORG: 'sumanthsv'
    ADO_PROJECT: 'nugetproject'
    ADO_FEED: 'nuget-feed'
    UPLOAD_DIR: '$(Pipeline.Workspace)/nuget-upload'
    PACKAGES_FILE: '$(Build.SourcesDirectory)/nuget-packages-to-sync.txt'
    MIGRATED_FILE: '$(Build.SourcesDirectory)/migrated-packages.txt'
    TO_MIGRATE_FILE: '$(Pipeline.Workspace)/to-migrate.txt'

  steps:
  - checkout: self
    persistCredentials: true

  # ── Step 1: JFrog CLI Pre-checks ─────────────────────────────────
  - task: JFrogCliV2@1
    displayName: 'JFrog CLI Pre-checks'
    inputs:
      jfrogPlatformConnection: 'jfrog-psblr'
      command: |
        jf c show
        jf rt ping

  # ── Step 2: Clean upload directory ────────────────────────────────
  - task: CmdLine@2
    displayName: 'Clean upload directory'
    inputs:
      script: |
        rm -rf $(UPLOAD_DIR)
        mkdir -p $(UPLOAD_DIR)
        echo "Clean upload directory ready"

  # ── Step 3: Compute which requested packages are NOT yet migrated ─
  - task: CmdLine@2
    displayName: 'Compute packages to migrate'
    inputs:
      script: |
        if [ ! -f "$(PACKAGES_FILE)" ]; then
          echo "##[error]nuget-packages-to-sync.txt not found in repo!"
          exit 1
        fi

        grep -v '^\s*#' "$(PACKAGES_FILE)" | grep -v '^\s*$' | sort -u > /tmp/requested.txt
        REQUESTED_COUNT=$(wc -l < /tmp/requested.txt)

        if [ -f "$(MIGRATED_FILE)" ]; then
          sort "$(MIGRATED_FILE)" -o "$(MIGRATED_FILE)"
          comm -23 /tmp/requested.txt "$(MIGRATED_FILE)" > $(TO_MIGRATE_FILE)
        else
          cp /tmp/requested.txt $(TO_MIGRATE_FILE)
        fi

        TO_MIGRATE_COUNT=$(wc -l < $(TO_MIGRATE_FILE))

        echo "══════════════════════════════════════"
        echo "Requested   : $REQUESTED_COUNT"
        echo "To migrate  : $TO_MIGRATE_COUNT"
        echo "Packages to migrate:"
        cat $(TO_MIGRATE_FILE)

        if [ "$TO_MIGRATE_COUNT" -eq 0 ]; then
          echo "##[warning]All requested packages already migrated — nothing to do!"
        fi

  # ── Step 4: Download packages to migrate ──────────────────────────
  - task: CmdLine@2
    displayName: 'Download NuGet packages from Azure feed'
    env:
      ADO_PAT: $(ADO_PAT)
    inputs:
      script: |
        TO_MIGRATE_COUNT=$(wc -l < $(TO_MIGRATE_FILE))
        [ "$TO_MIGRATE_COUNT" -eq 0 ] && { echo "Nothing to download"; exit 0; }

        BASE64_PAT=$(echo -n ":${ADO_PAT}" | base64 | tr -d '\n')
        AUTH="Authorization: Basic ${BASE64_PAT}"
        NUGET_BASE="https://pkgs.dev.azure.com/$(ADO_ORG)/$(ADO_PROJECT)/_packaging/$(ADO_FEED)/nuget/v3/flat2"

        TOTAL=$TO_MIGRATE_COUNT
        COUNT=0

        while IFS= read -r LINE || [ -n "$LINE" ]; do
          [[ -z "$LINE" ]] && continue
          COUNT=$((COUNT + 1))

          PACKAGE_ID=$(echo $LINE | cut -d':' -f1)
          VERSION=$(echo $LINE    | cut -d':' -f2)

          PACKAGE_ID_LOWER=$(echo $PACKAGE_ID | tr '[:upper:]' '[:lower:]')
          VERSION_LOWER=$(echo $VERSION | tr '[:upper:]' '[:lower:]')

          echo "[$COUNT/$TOTAL] $PACKAGE_ID $VERSION"

          FILE="${PACKAGE_ID_LOWER}.${VERSION_LOWER}.nupkg"
          URL="${NUGET_BASE}/${PACKAGE_ID_LOWER}/${VERSION_LOWER}/${FILE}"
          OUT="$(UPLOAD_DIR)/${FILE}"

          HTTP=$(curl -s -L -H "$AUTH" \
            -w "%{http_code}" \
            -o "$OUT" \
            "$URL" 2>/dev/null || echo "000")

          if [ "$HTTP" = "200" ]; then
            SIZE=$(ls -lh "$OUT" | awk '{print $5}')
            echo "  nupkg → ✅ ($SIZE)"
          else
            rm -f "$OUT"
            echo "  nupkg → ⏭  $HTTP (skipping)"
          fi

        done < $(TO_MIGRATE_FILE)

        echo "══════════════════════════════════════"
        echo "Total files ready to upload:"
        find $(UPLOAD_DIR) -type f | sort
        echo "Total: $(find $(UPLOAD_DIR) -type f | wc -l) files"

  # ── Step 5: Check if upload needed ────────────────────────────────
  - task: CmdLine@2
    displayName: 'Check if upload needed'
    inputs:
      script: |
        FILE_COUNT=$(find $(UPLOAD_DIR) -type f -name "*.nupkg" 2>/dev/null | wc -l)
        echo "Files to upload: $FILE_COUNT"
        find $(UPLOAD_DIR) -type f | sort

        if [ "$FILE_COUNT" -eq 0 ]; then
          echo "##vso[task.setvariable variable=SKIP_UPLOAD]true"
          echo "##[warning]No files to upload!"
        else
          echo "##vso[task.setvariable variable=SKIP_UPLOAD]false"
        fi

  # ── Step 6: Upload to JFrog ───────────────────────────────────────
  - task: JFrogCliV2@1
    displayName: 'Push NuGet packages to JFrog'
    condition: ne(variables['SKIP_UPLOAD'], 'true')
    inputs:
      jfrogPlatformConnection: 'jfrog-psblr'
      command: |
        jf rt u "$(UPLOAD_DIR)/*.nupkg" "$(JFROG_NUGET_REPO)/" --flat=true --threads=10 --detailed-summary --fail-no-op=false

  # ── Step 7: Update migrated-packages.txt and commit ────────────────
  - task: CmdLine@2
    displayName: 'Update migrated-packages.txt'
    condition: ne(variables['SKIP_UPLOAD'], 'true')
    inputs:
      script: |
        if [ -f "$(MIGRATED_FILE)" ]; then
          cat "$(MIGRATED_FILE)" $(TO_MIGRATE_FILE) | sort -u > "$(MIGRATED_FILE).tmp"
          mv "$(MIGRATED_FILE).tmp" "$(MIGRATED_FILE)"
        else
          sort $(TO_MIGRATE_FILE) -o "$(MIGRATED_FILE)"
        fi

        echo "Total tracked packages: $(wc -l < $(MIGRATED_FILE))"

        cd $(Build.SourcesDirectory)
        git config user.email "pipeline@ado.local"
        git config user.name "ADO Pipeline"
        git add migrated-packages.txt
        git commit -m "Update migrated-packages.txt after specific migration — $(date +%Y-%m-%d)" || echo "Nothing to commit"
        git push origin HEAD:$(Build.SourceBranchName) || echo "Push failed — check permissions"

  # ── Step 8: Verify ───────────────────────────────────────────────
  - task: JFrogCliV2@1
    displayName: 'Verify packages in JFrog'
    inputs:
      jfrogPlatformConnection: 'jfrog-psblr'
      command: |
        jf rt search "$(JFROG_NUGET_REPO)/*.nupkg" --include-dirs=false
